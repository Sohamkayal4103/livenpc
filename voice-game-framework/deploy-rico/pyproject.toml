[project]
name = "rico-bot"
version = "0.1.0"
description = "Rico — street-dealer NPC voice agent (Pipecat + Nemotron)"
requires-python = ">=3.11"
dependencies = [
    # `daily` added vs. the starter: Cekura/Pipecat Cloud connect over Daily.
    "pipecat-ai[daily,gradium,openai,runner,silero,webrtc,websocket]>=1.3.0",
    "pipecatcloud>=0.7.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]